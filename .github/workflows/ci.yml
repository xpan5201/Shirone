name: Shirone CI

on:
  push:
    branches: [main, main-INTL]
  pull_request:
    branches: [main, main-INTL]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm exec biome ci ./src --reporter=github

  checks:
    name: Diagnostics and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Astro diagnostics
        run: pnpm exec astro check

      - name: Check TypeScript declarations
        run: pnpm type-check

      - name: Check Svelte diagnostics
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: Validate manifests and schemas
        run: pnpm check:manifest

      - name: Validate package runtime manifest
        run: pnpm check:package-manifest

      - name: Run unit tests
        run: node --test "tests/**/*.test.mjs"

  windows-paths:
    name: Windows path regressions
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows path regressions
        run: node --test tests/paths.test.mjs tests/overlay.test.mjs tests/pagefind.test.mjs tests/cli-package-init.test.mjs

  build:
    name: Build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [26.13.0]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm build

      - name: Verify production artifacts and branch isolation
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";

            for (const file of [
              "dist/index.html",
              "dist/rss.xml",
              "dist/atom.xml",
              "dist/sitemap-index.xml",
              "dist/llms.txt",
              "dist/pagefind/pagefind.js",
            ]) {
              assert.ok(fs.existsSync(file), `Missing build artifact: ${file}`);
              assert.ok(fs.statSync(file).size > 0, `Empty build artifact: ${file}`);
            }

            const html = fs.readFileSync("dist/index.html", "utf8");
            const rss = fs.readFileSync("dist/rss.xml", "utf8");
            assert.ok(html.includes("data-region-key=\"cn\""), "Missing CN region switch entry");
            assert.ok(html.includes("data-region-key=\"intl\""), "Missing INTL region switch entry");

            const branch = process.env.TARGET_BRANCH || "";
            if (branch === "main") {
              assert.ok(rss.includes("https://www.mintyuki.com/"), "main RSS must use China domain");
              assert.ok(html.includes("桂ICP"), "main must keep mainland ICP footer");
              assert.ok(!fs.existsSync("wrangler.jsonc"), "main must not include wrangler.jsonc");
            } else if (branch === "main-INTL") {
              assert.ok(rss.includes("https://blog.yukinoo.com/"), "main-INTL RSS must use INTL domain");
              assert.ok(!html.includes("桂ICP"), "main-INTL must not include mainland ICP footer");
              assert.ok(fs.existsSync("wrangler.jsonc"), "main-INTL must include wrangler.jsonc");
            }
            console.log(`Build artifacts and branch isolation verified for ${branch || "local"}.`);
          '

  site-smoke:
    name: Site smoke and a11y
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run site smoke and WCAG a11y suite
        run: >-
          pnpm exec playwright test --workers=2
          tests/site/a11y.spec.ts
          tests/site/site-controls.spec.ts
          tests/site/top-app-bar.spec.ts
          tests/site/theme-scheme.spec.ts
          tests/site/post-list.spec.ts
          tests/site/footer.spec.ts
          tests/site/layout-stability.spec.ts
          tests/site/swup-navigation.spec.ts
          tests/site/not-found.spec.ts
